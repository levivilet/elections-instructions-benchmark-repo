name: Selection instructions benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      zed_post_open_settle_seconds:
        description: 'Seconds to settle after Zed opens the fixture (0–30; for readiness experiments)'
        required: false
        default: '10'
  schedule:
    - cron: '43 5 * * 1'
permissions:
  contents: read
concurrency:
  group: selection-${{ github.ref }}
  cancel-in-progress: false
jobs:
  accounting:
    name: Hardware accounting
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-generic build-essential
          sudo sysctl kernel.perf_event_paranoid=-1
          mkdir -p .tmp
          PERF=$(find -L /usr/lib/linux-tools -name perf -type f | sort | tail -n 1)
          sudo env LC_ALL=C python3 scripts/validate_accounting.py "$PERF"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hardware-accounting
          path: results/
          if-no-files-found: error
  benchmark:
    name: Selection (${{ matrix.editor }})
    needs: accounting
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        editor: [lvce, vscode, zed, lapce, basic-electron, codemirror6, codemirror5, ace]
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop and perf
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-generic python3 curl xz-utils sway seatd wl-clipboard build-essential cmake scdoc python3-gi gir1.2-gtk-3.0 \
            libgtk-3-0 libnss3 libgbm1 libxss1 libxtst6 libxkbcommon-x11-0 libxkbfile1 libsecret-1-0 \
            mesa-utils mesa-vulkan-drivers libvulkan1 libasound2t64
          sudo sysctl kernel.perf_event_paranoid=-1
          sudo systemctl stop seatd || true
          bash scripts/install-input.sh
      - name: Install pinned ARM artifact
        run: python3 scripts/install.py --editors "${{ matrix.editor }}"
      - uses: actions/checkout@v5
        if: matrix.editor == 'lvce'
        with:
          repository: lvce-editor/editor-worker
          ref: 694001f4c388e7a4099275092db5cce7e834f49e
          path: .tmp/candidate-worker
      - uses: actions/checkout@v5
        if: matrix.editor == 'lvce'
        with:
          repository: lvce-editor/virtual-dom
          ref: 9b271c2bf2f0ece8e193eaeae76761c85776c8c1
          path: .tmp/candidate-virtual-dom
      - uses: actions/checkout@v5
        if: matrix.editor == 'lvce'
        with:
          repository: lvce-editor/virtual-dom
          ref: 4c00282f940199629d6f440e7afb43369b76ba1a
          path: .tmp/skip-virtual-dom
      - uses: actions/setup-node@v6
        if: matrix.editor == 'lvce'
        with:
          node-version-file: .tmp/candidate-worker/.nvmrc
      - name: Build identified diagnostic candidate
        if: matrix.editor == 'lvce'
        working-directory: .tmp/candidate-worker
        run: |
          nice npm ci
          npm run build
          cp .tmp/dist/dist/editorWorkerMain.js ../tokenWorkerMain.js
      - name: Build identified virtual DOM diagnostic
        if: matrix.editor == 'lvce'
        working-directory: .tmp/candidate-virtual-dom
        run: |
          nice npm ci
          npm run build
      - name: Build unchanged-subtree diagnostic
        if: matrix.editor == 'lvce'
        working-directory: .tmp/skip-virtual-dom
        run: |
          nice npm ci
          npm run build
      - name: Bundle isolated property-comparison diagnostic
        if: matrix.editor == 'lvce'
        working-directory: .tmp/candidate-worker
        run: |
          # Override only this compiled module, retaining the worker's locked
          # dependency tree. This unreleased diagnostic cannot enter the report.
          cp ../candidate-virtual-dom/dist/virtual-dom-worker/dist/parts/VirtualDomDiffTree/CompareNodes.js node_modules/@lvce-editor/virtual-dom-worker/dist/parts/VirtualDomDiffTree/CompareNodes.js
          npm run build
          cp .tmp/dist/dist/editorWorkerMain.js ../propertyWorkerMain.js
          for module in DiffFlatTrees DiffTrees VirtualDomDiffTree; do
            cp "../candidate-virtual-dom/dist/virtual-dom-worker/dist/parts/VirtualDomDiffTree/$module.js" "node_modules/@lvce-editor/virtual-dom-worker/dist/parts/VirtualDomDiffTree/$module.js"
          done
          npm run build
      - uses: actions/checkout@v5
        if: matrix.editor == 'lvce'
        with:
          repository: lvce-editor/editor-worker
          ref: 7291fd4e62e58a73cf84c85a5f8852e125b59935
          path: .tmp/row-worker
      - name: Build identified row-cache candidate
        if: matrix.editor == 'lvce'
        working-directory: .tmp/row-worker
        run: |
          nice npm ci
          for module in CompareNodes DiffFlatTrees DiffTrees VirtualDomDiffTree; do
            cp "../candidate-virtual-dom/dist/virtual-dom-worker/dist/parts/VirtualDomDiffTree/$module.js" "node_modules/@lvce-editor/virtual-dom-worker/dist/parts/VirtualDomDiffTree/$module.js"
          done
          npm run build
      - uses: actions/checkout@v5
        if: matrix.editor == 'lvce'
        with:
          repository: lvce-editor/editor-worker
          ref: 91e0cee0bc07c32742ec5d7c649856035295b326
          path: .tmp/monospace-worker
      - name: Build combined pointer-render candidate
        if: matrix.editor == 'lvce'
        working-directory: .tmp/monospace-worker
        run: |
          nice npm ci
          for module in CompareNodes DiffFlatTrees DiffTrees VirtualDomDiffTree; do
            cp "../skip-virtual-dom/dist/virtual-dom-worker/dist/parts/VirtualDomDiffTree/$module.js" "node_modules/@lvce-editor/virtual-dom-worker/dist/parts/VirtualDomDiffTree/$module.js"
          done
          npm run build
          cp .tmp/dist/dist/editorWorkerMain.js ../monospaceControlWorkerMain.js
      - uses: actions/checkout@v5
        if: matrix.editor == 'lvce'
        with:
          repository: lvce-editor/editor-worker
          ref: d4662b53cd745270bc4622b99d84d5eef218cdab
          path: .tmp/dependency-worker
      - name: Build dependency-only control
        if: matrix.editor == 'lvce'
        working-directory: .tmp/dependency-worker
        run: |
          nice npm ci
          npm run build
      - uses: actions/checkout@v5
        if: matrix.editor == 'lvce'
        with:
          repository: lvce-editor/editor-worker
          ref: a45322d60d92a59d80dec53d0b369338136145c7
          path: .tmp/baseline-worker
      - name: Build matching source baseline
        if: matrix.editor == 'lvce'
        working-directory: .tmp/baseline-worker
        run: |
          nice npm ci
          npm run build
      - name: Measure three fresh-profile word selections
        env:
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCHMARK_COMMIT: ${{ github.sha }}
          BENCHMARK_ZED_POST_OPEN_SETTLE_SECONDS: ${{ github.event.inputs.zed_post_open_settle_seconds || '10' }}
          BENCHMARK_DIAGNOSE: ${{ (matrix.editor == 'lvce' || matrix.editor == 'codemirror5') && '1' || '0' }}
          BENCHMARK_ALLOCATION_PROFILE: '1'
          BENCHMARK_CANDIDATE_BUNDLE: ${{ matrix.editor == 'lvce' && format('{0}/.tmp/monospace-worker/.tmp/dist/dist/editorWorkerMain.js', github.workspace) || '' }}
          BENCHMARK_CANDIDATE_REVISION: 91e0cee0bc07c32742ec5d7c649856035295b326
          BENCHMARK_CANDIDATE_VIRTUAL_DOM_REVISION: 4c00282f940199629d6f440e7afb43369b76ba1a
          BENCHMARK_RENDERER_REVISION: 6576924dd096ffb9097990019d1158e900ff71fc
          BENCHMARK_MONOSPACE_CONTROL_BUNDLE: ${{ matrix.editor == 'lvce' && format('{0}/.tmp/monospaceControlWorkerMain.js', github.workspace) || '' }}
          BENCHMARK_ROW_BUNDLE: ${{ matrix.editor == 'lvce' && format('{0}/.tmp/row-worker/.tmp/dist/dist/editorWorkerMain.js', github.workspace) || '' }}
          BENCHMARK_ROW_REVISION: 7291fd4e62e58a73cf84c85a5f8852e125b59935
          BENCHMARK_CONTROL_REVISION: 694001f4c388e7a4099275092db5cce7e834f49e
          BENCHMARK_VIRTUAL_DOM_REVISION: 9b271c2bf2f0ece8e193eaeae76761c85776c8c1
          BENCHMARK_FLAT_BUNDLE: ${{ matrix.editor == 'lvce' && format('{0}/.tmp/candidate-worker/.tmp/dist/dist/editorWorkerMain.js', github.workspace) || '' }}
          BENCHMARK_PROPERTY_BUNDLE: ${{ matrix.editor == 'lvce' && format('{0}/.tmp/propertyWorkerMain.js', github.workspace) || '' }}
          BENCHMARK_TOKEN_BUNDLE: ${{ matrix.editor == 'lvce' && format('{0}/.tmp/tokenWorkerMain.js', github.workspace) || '' }}
          BENCHMARK_DEPENDENCY_BUNDLE: ${{ matrix.editor == 'lvce' && format('{0}/.tmp/dependency-worker/.tmp/dist/dist/editorWorkerMain.js', github.workspace) || '' }}
          BENCHMARK_BASELINE_BUNDLE: ${{ matrix.editor == 'lvce' && format('{0}/.tmp/baseline-worker/.tmp/dist/dist/editorWorkerMain.js', github.workspace) || '' }}
        run: |
          echo "Zed post-open settling: ${BENCHMARK_ZED_POST_OPEN_SETTLE_SECONDS}s"
          PERF=$(find -L /usr/lib/linux-tools -name perf -type f | sort | tail -n 1)
          bash scripts/run.sh "${{ matrix.editor }}" "$PERF"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: selection-${{ matrix.editor }}
          path: results/
          if-no-files-found: error
          retention-days: 90
  report:
    name: Tests and complete report
    if: ${{ !cancelled() }}
    needs: [accounting, benchmark]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 -m unittest discover -s tests
          node --test tests/electron-startup.cjs
      - uses: actions/download-artifact@v5
        if: needs.benchmark.result == 'success'
        with:
          pattern: selection-*
          path: results/editors
      - name: Build validated report
        if: needs.benchmark.result == 'success'
        run: python3 scripts/report.py --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' --commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v5
        if: needs.benchmark.result == 'success'
        with:
          name: measured-report
          path: .tmp/pages
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: needs.benchmark.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .tmp/pages
      - name: Require full hardware and editor coverage
        if: needs.accounting.result != 'success' || needs.benchmark.result != 'success'
        run: exit 1
  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: report
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
